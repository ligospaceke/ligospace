<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14284b">
<title>L.I.G.O. SPACE: Humanity First. Every Life Matters.</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;700&family=Libre+Baskerville:wght@400;700&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app"><p style="padding:24px;font-family:sans-serif">Loading L.I.G.O. SPACE…</p></div>
<noscript><p style="padding:24px;font-family:sans-serif">L.I.G.O. SPACE needs JavaScript turned on.</p></noscript>
<script>
/* Shows startup problems on screen instead of a blank page */
(function(){
  function show(msg){var a=document.getElementById('app');if(!a)return;
    a.innerHTML='<div style="margin:24px;padding:16px;border:2px solid #b4502c;border-radius:10px;background:#fff;font:15px/1.5 system-ui,sans-serif;color:#1d2433">'+
    '<b>L.I.G.O. SPACE could not start.</b><br>'+String(msg).replace(/</g,'&lt;')+
    '<br><br>Most often a file is missing or out of date in the repository. Make sure index.html, css/, js/ and assets/ are all at the repo root, then hard-refresh (Ctrl+Shift+R).</div>'}
  window.addEventListener('error',function(e){show((e.message||'Script failed to load')+(e.filename?' ('+e.filename.split('/').slice(-2).join('/')+':'+e.lineno+')':''))},true);
  window.addEventListener('unhandledrejection',function(e){show(e.reason&&e.reason.message||e.reason)});
})();
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
