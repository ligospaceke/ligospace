name = "ligo"
main = "src/index.js"
compatibility_date = "2026-09-01"
observability = { enabled = true }

# Serves the website from ./public; the Worker code only runs for /api/*
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Un-comment and update once your custom domain is on Cloudflare DNS
# routes = [{ pattern = "ligospace.co.ke", custom_domain = true }]

[[d1_databases]]
binding = "DB"
database_name = "ligo"
database_id = "6d6e177a-37b9-4c8d-9b19-fc50dbcc2642"

[ai]
binding = "AI"


[vars]
SUPABASE_URL = "https://lpnnntuelgaisoiimuka.supabase.co"
SIGNUP = "invite"                                          # "open" when ready for open registration
# Password hashing cost (Workers allows at most 100000). If you see error 1102 on the free plan, set 30000 or move to a paid plan.
# PW_ITER = "100000"
# Secrets (set with: npx wrangler secret put NAME): SUPABASE_SERVICE_KEY, SETUP_TOKEN (delete SETUP_TOKEN after the first admin password is set)
